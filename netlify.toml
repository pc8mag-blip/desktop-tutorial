[build]
  publish = "."

# Polish version — default
[[redirects]]
  from = "/pl"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/pl/"
  to = "/index.html"
  status = 200

# English version
[[redirects]]
  from = "/en"
  to = "/en/index.html"
  status = 200

[[redirects]]
  from = "/en/"
  to = "/en/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.web3forms.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com"

# Cache static assets
[[headers]]
  for = "/*.html"

  [headers.values]
    Cache-Control = "public, max-age=300"
